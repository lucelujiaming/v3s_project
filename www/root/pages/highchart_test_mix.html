<div id="chartContainer"></div>

<script type="text/javascript">
var options = {

    series: [{ name: '柱状图', type: 'column', data: [49.9, 71.5, 106.4, 129.2, 144.0, 176.0] }, { name: '折线图', type: 'line', yAxis: 1, data: [50, 75, 100, 125, 150, 175] }]
