<!DOCTYPE html>  
<html>  
<head>  
    <title>实时数据可视化图表</title>  
</head>  
<body>
<script type="text/javascript" src="../js/chart_2.8.0.js"></script>
<script type="text/javascript" src="../js/rough.js"></script>
<script type="text/javascript" src="../js/chartjs-plugin-rough.js"></script>
<div id="legend-container"></div>
<div id="Chart_Div">
<canvas id="myChart" width="200" height="100"></canvas>
</div>
<script type="text/javascript">
const CHART_COLORS = {
  red: 'rgb(255, 99, 132)',
  orange: 'rgb(255, 159, 64)',
  yellow: 'rgb(255, 205, 86)',
  green: 'rgb(75, 192, 192)',
  blue: 'rgb(54, 162, 235)',
  purple: 'rgb(153, 102, 255)',
  grey: 'rgb(201, 203, 207)'
};
const MONTHS = [
  'January',
  'February',
  'March',
  'April',
  'May',
  'June',
  'July',
  'August',
  'September',
  'October',
  'November',
  'December'
];
function months(config) {
  var cfg = config || {};
  var count = cfg.count || 12;
  var section = cfg.section;
  var values = [];
  var i, value;
  for (i = 0; i < count; ++i) {
    value = MONTHS[Math.ceil(i) % 12];
    values.push(value.substring(0, section));
  }
  return values;
}
const NUM_DATA = 7;
const NUM_CFG = {count: NUM_DATA, min: 0, max: 100};
const data = {
  labels: months({count: NUM_DATA}),
  datasets: [
    {
      label: 'Dataset<1>',
      data: [7, 3, 19, 15, 3, 32, 32, 32, 3, 3, 3, 3],
      borderColor: CHART_COLORS.red,
      backgroundColor: CHART_COLORS.orange,
      fill: false,
      rough: {
        roughness: 6,
        bowing: 2,
        fillStyle: 'cross-hatch',
        fillWeight: 0.25,
        hachureAngle: 15,
        hachureGap: 12
      }
    },
    {
      label: 'Dataset<2>',
      data: [12, 19, 3, 5, 2, 3, 3, 3, 3, 3, 3, 3],
      borderColor: CHART_COLORS.blue,
      backgroundColor: CHART_COLORS.purple,
      fill: false,
      rough: {
        roughness: 2,
        bowing: 2
      }
    },
  ],
};
const config = {
  type: 'line',
  data: data,
  plugins: [ChartRough],
  options: {
    plugins: {
      htmlLegend: {
        // ID of the container to put the legend in
        containerID: 'legend-container',
      },
      legend: {
        display: false,
      },
      tooltip: {
            backgroundColor: 'rgb(191,191,255)',
            titleColor: 'rgb(0,0,127)',
            bodyColor: 'rgb(0,0,0)',
            footerColor: 'rgb(0,0,0)',
            cornerRadius: '10',
            callbacks: {
                label: function(context) {
                        let label = context.dataset.label || '';
                        if (label) {
                            label += ': ';
                        }
                        if (context.parsed.y !== null) {
                            label += new Intl.NumberFormat(
                               'en-US', {minimumFractionDigits: 6}).format(context.parsed.y) ;
                        }
                        return label;
                }
            }
      }
    }
  }
};
const ctx = document.getElementById('myChart');
Chart.plugins.register(ChartRough);
const myChart = new Chart(ctx, config);
var startPoint, endPoint;
var isSelecting = false;
// 鼠标按下事件
myChart.canvas.onmousedown = function(e) {
    isSelecting = true;
    startPoint = { x: e.offsetX, y: e.offsetY };
};
// 鼠标移动事件
myChart.canvas.onmousemove = function(e) {
    if (isSelecting) {
        // 绘制圈选区域
        var ctx = myChart.canvas.getContext('2d');
        ctx.beginPath();
        ctx.clearRect(0, 0, myChart.width, myChart.height);
        myChart.draw();
        endPoint = { x: e.offsetX, y: e.offsetY };
        // ctx.rect(Math.min(startPoint.x, endPoint.x), Math.min(startPoint.y, endPoint.y),
        //     Math.abs(endPoint.x - startPoint.x), Math.abs(endPoint.y - startPoint.y));
        ctx.rect(Math.min(startPoint.x, endPoint.x), 0, // Math.min(startPoint.y, endPoint.y),
            Math.abs(endPoint.x - startPoint.x), myChart.height // Math.abs(endPoint.y - startPoint.y)
            );
        ctx.strokeStyle = 'rgba(255,0,0,0.5)';
        ctx.stroke();
    }
};
// 鼠标抬起事件
myChart.canvas.onmouseup = function(e) {
    if (isSelecting) {
        isSelecting = false;
        // 在这里处理圈选的逻辑
        // 例如: 过滤显示在选区内的数据项
        // 绘制圈选区域
        var chartArea = {
          left: Math.min(startPoint.x, endPoint.x),
          top: 0,
          right: Math.max(startPoint.x, endPoint.x),
          bottom: myChart.height,
          height: myChart.height,
          width: Math.abs(endPoint.x - startPoint.x)
        };
        myChart.draw(chartArea);
    }
};
</script>
<br>
</body>  
</html>
