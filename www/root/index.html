function getData(n, scale) {
    const arr = [];
    let i,
        x,
        a,
        b,
        c,
        spike;
    for (
        i = 0, x = Date.UTC(new Date().getUTCFullYear(), 0, 1) - n * 36e5;
        i < n;
        i = i + 1, x = x + 36e5
    ) {
        if (i % 100 === 0) {
            a = 2 * Math.random();
        }
        if (i % 1000 === 0) {
            b = 2 * Math.random();
        }
        if (i % 10000 === 0) {
            c = 2 * Math.random();
        }
        if (i % 50000 === 0) {
            spike = 10;
        } else {
            spike = 0;
        }
        arr.push([
            x,
            scale * Math.sin(i / 100) + a + b + c + spike + Math.random()
        ]);
    }
    return arr;
}

var checkApplicationFileName = function() {
    var fname = $("#application_filename")[0].innerText;
    if (!fname || fname.length == 0) {
        application_filestatus = 1;
    } else if (fname == "app.sab") {
        application_filestatus = 0;
    } else if (fname == "app.scode") {
        application_filestatus = 0;
    } else {
        application_filestatus = 2;
        $("div.error-tips-content").html("必须是app.sab和app.scode文件");
        $("div.widget-error-tips").css("display", "block");
    }
};

var checkSystemFileName = function() {
    var fname = $("#system_filename")[0].innerText;
    if (!fname || fname.length == 0) {
        system_filestatus = 1;
    } else if (/^firmware_V\d+\.\d+\.\d+-beta_\d+\.bin/.test(fname)) {
        system_filestatus = 0;
    } else {

        $("div.error-tips-content").html("必须是firmware_V0.0.0-beta_1665709921.bin格式的文件名");
        $("div.widget-error-tips").css("display", "block");

};

var instrument_config_status  = 0;

function checkInstrumentConfig(instrumentType) {
    var instrument_address     = $("#instrument_address")[0].value;
    var instrument_timespan    = $("#instrument_timespan")[0].value;
    var instrument_timeout     = $("#instrument_timeout")[0].value;
    var instrument_fault_times = $("#instrument_fault_times")[0].value;
    
    instrument_config_status  = 0;
    // 检查设备地址
    if (!instrument_address || instrument_address.length == 0) {
        instrument_config_status = 1;
        alert("设备地址为空！");
        return;
    } else if (/^([0-9]*)$/.test(instrument_address)) {
        instrument_config_status = 0;
    } else {
        instrument_config_status = 2;
        alert("设备地址格式错误！");
        return;
    }
    // 检查读取间隔(0.1s)
    if (!instrument_timespan || instrument_timespan.length == 0) {
        instrument_config_status = 1;
        alert("读取间隔为空！");
        return;
    } else if (/^([1-9]*)0$/.test(instrument_timespan)) {
        instrument_config_status = 0;
    } else {
        instrument_config_status = 2;
        alert("读取间隔格式错误：读取间隔为10的倍数！");
        return;
    }
    // 检查超时时间(0.1s) 
    if (!instrument_timeout || instrument_timeout.length == 0) {
        instrument_config_status = 1;
        alert("超时时间为空！");
        return;
    } else if (/^([1-9]*)$/.test(instrument_timeout)) {
        instrument_config_status = 0;
    } else {
        instrument_config_status = 2;
        alert("超时时间格式错误！");
        return;
    }
    // 检查最大故障次数 
    if (!instrument_fault_times || instrument_fault_times.length == 0) {
        instrument_config_status = 1;
        alert("超时时间为空！");
        return;
    } else if (/^([1-9][0-9]*)$/.test(instrument_fault_times)) {
        instrument_config_status = 0;
    } else {
        instrument_config_status = 2;
        alert("最大故障次数格式错误：最大故障次数为数字！");
        return;
    }
}

function setInstrumentClassByType(instrumentType) {
	var instrumentClassSelect = document.getElementById('instrument_class');
    if((instrumentType == 0) || (instrumentType == 1)  // PDS-PA（HPGP101） & mLPC101
     ||(instrumentType == 2) || (instrumentType == 16)) // Lasair III & PDS-E（PMS Mode）
    {
        instrumentClassSelect.options[0].selected = true;
    }
    else if(instrumentType == 3)   // Tracer2，Aquavolt
    {
        instrumentClassSelect.options[1].selected = true;
    }
    else if(instrumentType == 4)   //MX1-A，MXNY
    {
        instrumentType.options[2].selected = true;
    }
    else if(instrumentType == 5)   // RCP，FID，PDHID
    {
        instrumentClassSelect.options[3].selected = true;
    }
    else if(instrumentType == 6)   // 310E，550E，560，745，750
    {
        instrumentClassSelect.options[4].selected = true;
    }
    else if(instrumentType == 7)   // HALO+，HALO 3Q，SPARK
    {
        instrumentType.options[5].selected = true;
    }
    else if(instrumentType == 8)   // DID550，ORTHOSMART
    {
        instrumentClassSelect.options[6].selected = true;
    }
    else if(instrumentClassSelect == 9)   // TA7000，TA5000
    {
        instrumentClassSelect.options[7].selected = true;
    }
    else if((instrumentType == 10)      // 5830，5920，3050
         && (instrumentType == 11))     // 2850
    {
        instrumentClassSelect.options[8].selected = true;
    }
    else if(instrumentType == 12)   // U3000
    {
        instrumentClassSelect.options[9].selected = true;
    }
    else if((instrumentType == 13)      // Nanochrome
         && (instrumentType == 14))     // K1000A
    {
        instrumentClassSelect.options[10].selected = true;
    }
    else if(instrumentType == 15)   // WCPC-0703E
    {
        instrumentClassSelect.options[11].selected = true;
    }
    else if(instrumentType == 17)   // HGPC-100（EX）
    {
        instrumentClassSelect.options[12].selected = true;
    }
};

var updateContent = function(url, fun) {
    var req = false;
    if (window.XMLHttpRequest) {
        try {
            req = new XMLHttpRequest();
        } catch (e) {
            req = false;
        }
    } else if (window.ActiveXObject) {
        try {
            req = new ActiveXObject("Msxml2.XMLHTTP");
        } catch (e) {
            try {
                req = new ActiveXObject("Microsoft.XMLHTTP");
            } catch (e) {
                req = false;
            }
        }
    }
    if (req) {
        req.open('GET', url, false);
        req.send(null);
        $("#func-advanced").html(req.responseText);
        if (funs[fun]) {
            funs[fun]();
        }
        else
        {
            // alert("updateContent = " + url);
            if(url == "pages/system_state.html")
            {
                $("div.loading-container#loading-container").css("display", "block");
                // 当前版本 & 发布日期
                $.get("/action/status?mode=get_systeminfo", function(_data, _status){
                    $("div.loading-container#loading-container").css("display", "none");
                    var data_json = JSON.parse(_data);
                    $.each(data_json, function(index, info){
                        // if (info.version && $("#software_version").length > 0) {
                        if (index == "cpuload") {
                            $("#cpuload_info").attr("value", info);
                        }
                        else if (index == "mem") {
                            $("#mem_info").attr("value", info);
                        }
                        else if (index == "svm") {
                            $("#svm_info").attr("value", info);
                        }
                    });
                });
            }
        }
    } else {
        $("#func-advanced").html("Inner Error !");
    }
    
};

            current_subpage = url;
            var fstMenuList = $("li.fst");
            $(fstMenuList).each(function(i, obj) {
                    var that = $(obj);
                    that.removeClass("selected")
                });
            fstMenuList = $("a.fst");
            $(fstMenuList).each(function(i, obj) {
                    var that = $(obj);
                    that.removeClass("selected")
                });
            if (me.attr("data-child") == "no") {
                updateContent(url, fun);
                me.addClass("selected");
                me.closest("li.fst").addClass("selected");
            } else {
            }
        }).delegate("ul.menu-tree li.sec a.sec", "click", function(e) {
        });
    // 隐藏显示加载图标
    $("div.loading-container#loading-container").css("display", "none");
    $("div.mask#mask").css("display", "none")
    document.title = "CMP500";
    updateContent("pages/system_state.html", "none");
});
</script>
